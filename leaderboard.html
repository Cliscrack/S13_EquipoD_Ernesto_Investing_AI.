<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard · Ernesto Investing AI</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="leaderboard"><main>
<h1>Leaderboard de la liga</h1>
<p class="mut">Ranking de traders ficticios y el suyo (según su portafolio de la pestaña Trading, comparado con el valor inicial de la demo).</p>
<p id="nivel-elegido" class="aviso"></p>
<h2>Primeros puestos</h2><div class="grid" id="podio"></div>
<h2>Clasificación general</h2><div class="tw"><table><thead><tr><th scope="col">#</th><th scope="col" class="l">Alias</th><th scope="col">Equipo</th><th scope="col">Retorno</th><th scope="col">Operaciones</th><th scope="col">Sharpe</th></tr></thead><tbody id="tb"></tbody></table></div>
<script src="js/common.js"></script>
<script>
window.init=async()=>{ const L=await loadJSON("12_leaderboard_liga.json"), D=await loadJSON("10_dashboard_mercado.json"), w=await loadJSON("11_watchlist_alertas_portafolio_demo.json"); const S=store("eia_port")||w.portafolio_demo;
 const px=t=>D.find(d=>d.ticker===t).ultimo; const base=w.portafolio_demo.efectivo+w.portafolio_demo.posiciones.reduce((a,p)=>a+p.cantidad*p.costo,0); const nav=S.efectivo+S.posiciones.reduce((a,p)=>a+p.cantidad*px(p.ticker),0);
 $("#nivel-elegido").textContent=store("eia_nivel")?"Cartera objetivo elegida: "+store("eia_nivel")+". La clasificación refleja las posiciones realmente registradas en Trading.":"No se ha seleccionado una cartera objetivo."; const yo={alias:"Usted",equipo:"—",retorno_liga_pct:(nav/base-1)*100,operaciones:"—",sharpe:"—",yo:1}; const all=[...L,yo].sort((a,b)=>b.retorno_liga_pct-a.retorno_liga_pct);
 $("#podio").innerHTML=all.slice(0,3).map((x,i)=>`<div class="card kpi"><div class="mut">Puesto ${i+1}</div><div class="v">${x.alias}</div><div class="${fmt.cls(x.retorno_liga_pct)}">${fmt.pct(x.retorno_liga_pct)}</div></div>`).join("");
 $("#tb").innerHTML=all.map((x,i)=>`<tr ${x.yo?'class="mi-puesto"':''}><td>${i+1}</td><th scope="row" class="l">${x.alias}</th><td>${x.equipo}</td><td class="${fmt.cls(x.retorno_liga_pct)}">${fmt.pct(x.retorno_liga_pct)}</td><td>${x.operaciones}</td><td>${x.sharpe}</td></tr>`).join(""); };
</script></main></body></html>
